[theme]
# Force light theme only - disable dark mode completely
base = "light"
primaryColor = "#3498db"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#2c3e50"
font = "sans serif"

[client]
# Prevent users from switching to dark theme
showErrorDetails = false

[browser]
# Gather usage stats
gatherUsageStats = false
