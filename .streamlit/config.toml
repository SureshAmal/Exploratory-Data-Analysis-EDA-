[theme]
# Force light theme only - disable dark mode completely
base = "light"
primaryColor = "#3498db"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#2c3e50"
font = "sans serif"

[client]
# Prevent users from switching to dark theme
showErrorDetails = false

[browser]
# Gather usage stats
gatherUsageStats = false

[theme.sidebar]
# Sidebar-specific theme values to avoid empty color warnings from the frontend
backgroundColor = "#f8f9fa"
textColor = "#2c3e50"
primaryColor = "#3498db"
secondaryBackgroundColor = "#ffffff"
widgetBackgroundColor = "#ffffff"
widgetBorderColor = "#d8d2c8"
skeletonBackgroundColor = "#f5f5f5"
